
{% extends 'base.html' %}

{% block title %}Login | HR Payroll System{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">

        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">HR Payroll System</h4>
            </div>

            <div class="card-body p-4">

                <h5 class="text-center mb-4">Sign In</h5>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Invalid username or password.
                        Please try again.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="username"
                               class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            id="username"
                            class="form-control"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="password"
                               class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <input
                        type="hidden"
                        name="next"
                        value="{{ next }}"
                    >

                    <button
                        type="submit"
                        class="btn btn-primary w-100">
                        Login
                    </button>
                </form>

            </div>
        </div>

        <p class="text-center text-muted mt-3">
            HR Payroll Management System
        </p>

    </div>
</div>

{% endblock %}
